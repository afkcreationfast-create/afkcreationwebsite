services:
  - type: web
    name: afk-creation
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ROOT_DOMAIN
        value: afkcreation.site
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: afk-creation-db
          property: connectionString

databases:
  - name: afk-creation-db
    plan: free
