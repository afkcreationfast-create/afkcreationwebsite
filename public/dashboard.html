<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mon espace — AFK Creation</title><link rel="stylesheet" href="/styles.css"><style>
body{min-height:100vh}.dash{width:min(1100px,calc(100% - 40px));margin:55px auto}.dash-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:35px}.dash h1{font:800 42px var(--display);letter-spacing:-.06em;margin:12px 0}.dash-sub{color:var(--muted)}.dash-layout{display:grid;grid-template-columns:1fr 1.2fr;gap:18px}.panel{background:#111a2a;border:1px solid var(--line);border-radius:16px;padding:24px}.panel h2{font:700 19px var(--display);margin:0 0 18px}.panel label{display:block;color:#aeb9ce;font-size:11px;margin:14px 0}.panel input,.panel textarea,.panel select{display:block;width:100%;margin-top:7px;background:#0a1120;color:white;border:1px solid #ffffff20;border-radius:9px;padding:12px;font:13px var(--font)}.panel textarea{min-height:80px;resize:vertical}.panel input:focus,.panel textarea:focus{outline:1px solid #8375ff}.panel .btn{margin-top:12px}.hint{font-size:11px;color:#8290a8;line-height:1.6}.site-item{border:1px solid var(--line);border-radius:11px;padding:14px;margin-top:10px;display:flex;justify-content:space-between;gap:12px;align-items:center}.site-item b{font-size:13px}.site-item small{display:block;color:#8d9ab1;margin-top:4px}.status{font-size:10px;color:#69dcb1}.dash-error{color:#ff9aab;font-size:12px;min-height:18px;margin-top:8px}.empty{color:#8996ad;font-size:13px;padding:20px 0}@media(max-width:750px){.dash-layout{grid-template-columns:1fr}.dash-head{align-items:flex-start;gap:15px;flex-direction:column}.dash h1{font-size:34px}}
</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark">A</span><span>AFK<span class="brand-light">CREATION</span></span></a><button class="btn btn-ghost" id="logout">Déconnexion</button></header>
<main class="dash"><div class="eyebrow">ESPACE CRÉATEUR</div><h1>Ton prochain site commence ici.</h1><p class="dash-sub" id="welcome">Chargement de ton espace…</p>
<div class="dash-layout"><section class="panel"><h2>Créer un nouveau site</h2><form id="createForm">
<label>Nom du site<input id="siteTitle" required maxlength="70" placeholder="JJR Shop"></label>
<label>Adresse souhaitée<div style="display:flex;align-items:center;gap:5px"><input id="subdomain" required maxlength="30" placeholder="jjrshop" style="margin:0;min-width:0"><span style="white-space:nowrap;color:#8290a8;font-size:11px">.afkcreation.site</span></div></label>
<label>Petite description<input id="description" maxlength="240" placeholder="Une phrase pour présenter ton projet"></label>
<label>Grand titre de la page<input id="hero" maxlength="120" placeholder="Bienvenue chez JJR Shop"></label>
<label>Texte de présentation<textarea id="intro" maxlength="500" placeholder="Présente ton activité en quelques mots."></textarea></label>
<label>E-mail de contact<input id="contact" type="email" placeholder="contact@exemple.com"></label>
<label>Style<select id="theme"><option value="midnight">Dark premium</option><option value="light">Clair minimaliste</option></select></label>
<button class="btn btn-primary" type="submit">Créer mon site ↗</button><div class="dash-error" id="createError"></div><p class="hint">La création prépare ton site. Tu pourras le publier depuis la liste de tes projets.</p>
</form></section><section class="panel"><h2>Mes sites</h2><div id="siteList" class="empty">Chargement…</div></section></div></main><script src="/dashboard.js"></script></body></html>
